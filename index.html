<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时滚动字幕与翻译 (增强定制版)</title>
  
  <!-- 引入 React 和 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor 图标库 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .hide-scrollbar::-webkit-scrollbar { width: 0px; background: transparent; }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 默认配置项
    const defaultConfig = {
      language: 'zh-CN',
      gasUrl: '',
      
      trans1Enabled: false, trans1Lang: 'en', trans1Color: '#FFFF00', trans1Size: 36,
      trans2Enabled: false, trans2Lang: 'ja', trans2Color: '#00FFFF', trans2Size: 36,
      
      fontFamily: 'sans-serif', fontWeight: 900, textAlign: 'center', verticalAlign: 'bottom',
      letterSpacing: 0, lineHeight: 1.2,
      
      mainFontSize: 48, mainFontColor: '#FFFFFF', strokeColor: '#000000', strokeWidth: 4,
      bgColor: '#00FF00', bgOpacity: 100
    };

    const App = () => {
      // --- 核心状态 ---
      const [isListening, setIsListening] = useState(false);
      const [history, setHistory] = useState([]); // { id, original, t1, t2 }
      const [currentTranscript, setCurrentTranscript] = useState('');

      const [showSettings, setShowSettings] = useState(true);
      const [obsMode, setObsMode] = useState(false);

      // --- 统一配置管理 (支持本地存储) ---
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('subtitleConfig');
          if (saved) return { ...defaultConfig, ...JSON.parse(saved) };
        } catch (e) {
          console.error("加载配置失败", e);
        }
        return defaultConfig;
      });

      // 每次 config 改变时，自动保存到 localStorage
      useEffect(() => {
        localStorage.setItem('subtitleConfig', JSON.stringify(config));
      }, [config]);

      const updateConfig = (key, value) => {
        setConfig(prev => ({ ...prev, [key]: value }));
      };

      // --- 导入与导出配置 ---
      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "subtitle_settings.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const importedConfig = JSON.parse(e.target.result);
            setConfig(prev => ({ ...prev, ...importedConfig }));
            alert("配置导入成功！");
          } catch (error) {
            alert("导入失败，文件格式不正确。");
          }
        };
        reader.readAsText(file);
        // 清空 input 值，允许重复导入同一个文件
        event.target.value = '';
      };

      // --- Refs ---
      const recognitionRef = useRef(null);
      const scrollRef = useRef(null);
      
      // 使用 Ref 追踪最新状态以供异步事件使用
      const stateRef = useRef({ 
        isListening, 
        gasUrl: config.gasUrl, 
        language: config.language,
        trans1Enabled: config.trans1Enabled, trans1Lang: config.trans1Lang, 
        trans2Enabled: config.trans2Enabled, trans2Lang: config.trans2Lang 
      });

      useEffect(() => {
        stateRef.current = { 
          isListening, 
          gasUrl: config.gasUrl, 
          language: config.language,
          trans1Enabled: config.trans1Enabled, trans1Lang: config.trans1Lang, 
          trans2Enabled: config.trans2Enabled, trans2Lang: config.trans2Lang 
        };
      }, [isListening, config.gasUrl, config.language, config.trans1Enabled, config.trans1Lang, config.trans2Enabled, config.trans2Lang]);

      // --- 翻译 API 调用 (Google Apps Script) ---
      const fetchTranslation = async (text, targetLang) => {
        const url = stateRef.current.gasUrl.trim();
        if (!url) return "[请先配置 GAS URL]";
        
        try {
          let sourceLang = stateRef.current.language;
          if (sourceLang === 'ja-JP') sourceLang = 'ja';
          else if (sourceLang === 'en-US') sourceLang = 'en';
          else if (sourceLang === 'ko-KR') sourceLang = 'ko';

          const res = await fetch(`${url}?text=${encodeURIComponent(text)}&source=${sourceLang}&target=${targetLang}`);
          const translatedText = await res.text();
          return translatedText;
        } catch (e) {
          console.error("GAS Fetch error:", e);
          return "[网络错误或跨域拦截]";
        }
      };

      // --- 初始化语音识别 ---
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("您的浏览器不支持语音识别 API。");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognitionRef.current = recognition;

        recognition.onresult = async (event) => {
          let interim = '';
          let final = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              final += event.results[i][0].transcript;
            } else {
              interim += event.results[i][0].transcript;
            }
          }

          if (final) {
            const text = final.trim();
            if (!text) return;

            const itemId = Date.now() + Math.random().toString();
            
            setHistory((prev) => [
              ...prev, 
              { 
                id: itemId, 
                original: text, 
                t1: stateRef.current.trans1Enabled ? '...' : '', 
                t2: stateRef.current.trans2Enabled ? '...' : '' 
              }
            ]);

            const t1Promise = stateRef.current.trans1Enabled 
              ? fetchTranslation(text, stateRef.current.trans1Lang) 
              : Promise.resolve('');
            
            const t2Promise = stateRef.current.trans2Enabled 
              ? fetchTranslation(text, stateRef.current.trans2Lang) 
              : Promise.resolve('');

            const [res1, res2] = await Promise.all([t1Promise, t2Promise]);

            setHistory((prev) => 
              prev.map(item => 
                item.id === itemId ? { ...item, t1: res1, t2: res2 } : item
              )
            );
          }
          
          setCurrentTranscript(interim);
        };

        recognition.onerror = (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') {
            console.log(`Speech recognition silent abort: ${event.error}`);
            return;
          }
          console.error("Speech recognition error", event.error);
          if (event.error === 'not-allowed') {
            setIsListening(false);
            stateRef.current.isListening = false;
            alert("麦克风被拒绝！请检查浏览器权限。");
          }
        };

        recognition.onend = () => {
          if (stateRef.current.isListening) {
            setTimeout(() => {
              try {
                if (recognitionRef.current && stateRef.current.isListening) {
                  recognitionRef.current.start();
                }
              } catch (e) {}
            }, 300);
          }
        };

        return () => {
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
        };
      }, []);

      // 监听语言变化
      useEffect(() => {
        if (recognitionRef.current) {
          recognitionRef.current.lang = config.language;
          if (stateRef.current.isListening) {
            recognitionRef.current.stop();
          }
        }
      }, [config.language]);

      // 控制开关
      const toggleListening = () => {
        const nextState = !isListening;
        setIsListening(nextState);
        stateRef.current.isListening = nextState;
        
        if (nextState) {
          try {
            recognitionRef.current.start();
          } catch (e) {}
        } else {
          recognitionRef.current.stop();
          setCurrentTranscript('');
        }
      };

      // 自动滚动
      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [history, currentTranscript]);

      const hexToRgba = (hex, alpha) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha / 100})`;
      };

      // --- 样式定义 ---
      const baseTextStyle = {
        fontFamily: config.fontFamily,
        fontWeight: config.fontWeight,
        WebkitTextStroke: `${config.strokeWidth}px ${config.strokeColor}`,
        paintOrder: 'stroke fill',
        lineHeight: config.lineHeight,
        letterSpacing: `${config.letterSpacing}px`,
        textAlign: config.textAlign,
        margin: '2px 0'
      };

      // 垂直对齐 CSS 逻辑
      const verticalMarginClass = 
        config.verticalAlign === 'top' ? 'mb-auto mt-0' :
        config.verticalAlign === 'center' ? 'my-auto' :
        'mt-auto mb-0';

      return (
        <div 
          className="relative w-full h-screen flex flex-col overflow-hidden font-sans"
          style={{ backgroundColor: hexToRgba(config.bgColor, config.bgOpacity) }}
        >
          {/* 顶部控制栏 */}
          {!obsMode && (
            <div className="absolute top-4 left-4 z-50 flex flex-wrap gap-2">
              <button
                onClick={toggleListening}
                className={`flex items-center gap-2 px-4 py-2 rounded-full font-bold shadow-lg transition-colors ${
                  isListening ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white'
                }`}
              >
                <i className={`ph-bold text-lg ${isListening ? 'ph-microphone-slash' : 'ph-microphone'}`}></i>
                {isListening ? '停止识别' : '开始识别'}
              </button>
              
              <button
                onClick={() => setShowSettings(!showSettings)}
                className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 hover:bg-white text-gray-800 shadow-lg font-bold transition-colors"
              >
                <i className="ph-bold ph-gear text-lg"></i> 设置
              </button>

              <button
                onClick={() => setHistory([])}
                className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 hover:bg-white text-gray-800 shadow-lg font-bold transition-colors"
              >
                <i className="ph-bold ph-trash text-lg"></i> 清空字幕
              </button>

              <button
                onClick={() => setObsMode(true)}
                className="flex items-center gap-2 px-4 py-2 rounded-full bg-green-500 hover:bg-green-600 text-white shadow-lg font-bold transition-colors"
              >
                <i className="ph-bold ph-monitor-play text-lg"></i> OBS模式 (隐藏UI)
              </button>
            </div>
          )}

          {/* OBS 退出提示层 */}
          {obsMode && (
            <div 
              className="absolute top-0 left-0 w-full h-24 z-50 group flex items-center justify-center"
              onDoubleClick={() => setObsMode(false)}
            >
              <div className="opacity-0 group-hover:opacity-100 bg-black/60 text-white px-6 py-2 rounded-full transition-opacity cursor-pointer shadow-lg">
                双击此处退出 OBS 纯净模式
              </div>
            </div>
          )}

          {/* 设置面板 */}
          {!obsMode && showSettings && (
            <div className="absolute top-20 left-4 z-40 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200 w-96 flex flex-col" style={{ maxHeight: 'calc(100vh - 100px)' }}>
              
              <div className="flex justify-between items-center p-4 border-b border-gray-200 shrink-0">
                <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                  <i className="ph-bold ph-sliders text-xl"></i>控制面板
                </h2>
                <div className="flex items-center gap-1">
                  {/* 导入/导出按钮 */}
                  <label className="text-gray-500 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg cursor-pointer transition-colors" title="导入配置">
                    <i className="ph-bold ph-upload-simple text-lg"></i>
                    <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                  </label>
                  <button onClick={handleExport} className="text-gray-500 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg transition-colors" title="导出配置">
                    <i className="ph-bold ph-download-simple text-lg"></i>
                  </button>
                  <div className="w-px h-5 bg-gray-300 mx-1"></div>
                  <button onClick={() => setShowSettings(false)} className="text-gray-500 hover:text-gray-800 p-1.5 hover:bg-gray-100 rounded-lg transition-colors">
                    <i className="ph-bold ph-x text-lg"></i>
                  </button>
                </div>
              </div>

              <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                
                {/* 模块：语音与API */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">🎙️ 语音与翻译</h3>
                  <div className="space-y-2">
                    <label className="block text-xs font-bold text-gray-700">识别语言</label>
                    <select value={config.language} onChange={(e) => updateConfig('language', e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-lg outline-none bg-gray-50">
                      <option value="zh-CN">中文 (简体)</option>
                      <option value="zh-TW">中文 (繁體)</option>
                      <option value="ja-JP">日本語</option>
                      <option value="en-US">English (US)</option>
                      <option value="ko-KR">한국어</option>
                    </select>
                  </div>
                  <div className="space-y-2">
                    <label className="block text-xs font-bold text-gray-700">Google Apps Script (GAS) URL</label>
                    <input 
                      type="text" 
                      placeholder="https://script.google.com/macros/s/..."
                      value={config.gasUrl}
                      onChange={(e) => updateConfig('gasUrl', e.target.value)}
                      className="w-full p-2 text-sm border border-gray-300 rounded-lg outline-none bg-gray-50"
                    />
                    <p className="text-[10px] text-gray-500 leading-tight">请填入您部署的 GAS Web App URL。这与 jimakuChan 采用的免费翻译方案完全一致。</p>
                  </div>
                </div>

                {/* 模块：翻译目标 */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">🌍 多语言翻译</h3>
                  
                  {/* 翻译 1 */}
                  <div className="p-3 bg-blue-50 border border-blue-100 rounded-xl space-y-2">
                    <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-blue-800">
                      <input type="checkbox" checked={config.trans1Enabled} onChange={(e) => updateConfig('trans1Enabled', e.target.checked)} className="rounded" />
                      开启翻译 1
                    </label>
                    {config.trans1Enabled && (
                      <div className="grid grid-cols-3 gap-2 mt-2">
                        <select value={config.trans1Lang} onChange={(e) => updateConfig('trans1Lang', e.target.value)} className="col-span-3 p-1.5 text-xs border border-blue-200 rounded outline-none">
                          <option value="en">English</option>
                          <option value="ja">日本語</option>
                          <option value="zh-CN">中文(简体)</option>
                          <option value="zh-TW">中文(繁體)</option>
                          <option value="ko">한국어</option>
                        </select>
                        <div className="col-span-2 flex items-center gap-1">
                          <span className="text-[10px] text-gray-600 whitespace-nowrap">大小 ({config.trans1Size}px)</span>
                          <input type="range" min="12" max="80" value={config.trans1Size} onChange={(e) => updateConfig('trans1Size', Number(e.target.value))} className="w-full" />
                        </div>
                        <input type="color" value={config.trans1Color} onChange={(e) => updateConfig('trans1Color', e.target.value)} className="w-full h-6 p-0 border-0 rounded cursor-pointer col-span-1" />
                      </div>
                    )}
                  </div>

                  {/* 翻译 2 */}
                  <div className="p-3 bg-purple-50 border border-purple-100 rounded-xl space-y-2">
                    <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-purple-800">
                      <input type="checkbox" checked={config.trans2Enabled} onChange={(e) => updateConfig('trans2Enabled', e.target.checked)} className="rounded" />
                      开启翻译 2
                    </label>
                    {config.trans2Enabled && (
                      <div className="grid grid-cols-3 gap-2 mt-2">
                        <select value={config.trans2Lang} onChange={(e) => updateConfig('trans2Lang', e.target.value)} className="col-span-3 p-1.5 text-xs border border-purple-200 rounded outline-none">
                          <option value="en">English</option>
                          <option value="ja">日本語</option>
                          <option value="zh-CN">中文(简体)</option>
                          <option value="zh-TW">中文(繁體)</option>
                          <option value="ko">한국어</option>
                        </select>
                        <div className="col-span-2 flex items-center gap-1">
                          <span className="text-[10px] text-gray-600 whitespace-nowrap">大小 ({config.trans2Size}px)</span>
                          <input type="range" min="12" max="80" value={config.trans2Size} onChange={(e) => updateConfig('trans2Size', Number(e.target.value))} className="w-full" />
                        </div>
                        <input type="color" value={config.trans2Color} onChange={(e) => updateConfig('trans2Color', e.target.value)} className="w-full h-6 p-0 border-0 rounded cursor-pointer col-span-1" />
                      </div>
                    )}
                  </div>
                </div>

                {/* 模块：排版与布局 */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">🅰️ 字体与排版</h3>
                  
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">字体 (Font Family)</label>
                      <select value={config.fontFamily} onChange={(e) => updateConfig('fontFamily', e.target.value)} className="w-full p-1.5 text-xs border border-gray-300 rounded outline-none">
                        <option value="sans-serif">无衬线体 (黑体)</option>
                        <option value="serif">衬线体 (宋体)</option>
                        <option value="monospace">等宽字体</option>
                        <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                        <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                      </select>
                    </div>
                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">字重 (Font Weight)</label>
                      <select value={config.fontWeight} onChange={(e) => updateConfig('fontWeight', Number(e.target.value))} className="w-full p-1.5 text-xs border border-gray-300 rounded outline-none">
                        <option value="400">常规 (Normal)</option>
                        <option value="700">粗体 (Bold)</option>
                        <option value="900">黑体 (Black)</option>
                      </select>
                    </div>

                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">水平对齐</label>
                      <div className="flex border border-gray-300 rounded overflow-hidden">
                        {['left', 'center', 'right'].map(align => (
                          <button 
                            key={`h-${align}`} onClick={() => updateConfig('textAlign', align)}
                            className={`flex-1 py-1 text-lg flex justify-center items-center ${config.textAlign === align ? 'bg-gray-200 text-black' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                            title={`水平居${align === 'left' ? '左' : align === 'right' ? '右' : '中'}`}
                          >
                            <i className={`ph ph-text-align-${align}`}></i>
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">垂直对齐</label>
                      <div className="flex border border-gray-300 rounded overflow-hidden">
                        {[
                          { val: 'top', icon: 'ph-align-top' }, 
                          { val: 'center', icon: 'ph-align-center-vertical' }, 
                          { val: 'bottom', icon: 'ph-align-bottom' }
                        ].map(align => (
                          <button 
                            key={`v-${align.val}`} onClick={() => updateConfig('verticalAlign', align.val)}
                            className={`flex-1 py-1 text-lg flex justify-center items-center ${config.verticalAlign === align.val ? 'bg-gray-200 text-black' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                            title={`垂直居${align.val === 'top' ? '上' : align.val === 'bottom' ? '下' : '中'}`}
                          >
                            <i className={`ph ${align.icon}`}></i>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">行高 ({config.lineHeight})</label>
                      <input type="range" min="1" max="2.5" step="0.1" value={config.lineHeight} onChange={(e) => updateConfig('lineHeight', Number(e.target.value))} className="w-full" />
                    </div>
                    <div className="space-y-1">
                      <label className="block text-xs font-bold text-gray-600">字间距 ({config.letterSpacing}px)</label>
                      <input type="range" min="-5" max="20" step="1" value={config.letterSpacing} onChange={(e) => updateConfig('letterSpacing', Number(e.target.value))} className="w-full" />
                    </div>
                  </div>
                </div>

                {/* 模块：主字幕颜色 */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">🎨 主字幕颜色</h3>
                  
                  <div className="space-y-1">
                    <label className="flex justify-between text-xs font-bold text-gray-600">
                      <span>主字幕大小</span><span>{config.mainFontSize}px</span>
                    </label>
                    <input type="range" min="16" max="100" value={config.mainFontSize} onChange={(e) => updateConfig('mainFontSize', Number(e.target.value))} className="w-full" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="block text-xs text-gray-600">填充颜色</label>
                      <input type="color" value={config.mainFontColor} onChange={(e) => updateConfig('mainFontColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer" />
                    </div>
                    <div className="space-y-1">
                      <label className="block text-xs text-gray-600">描边颜色</label>
                      <input type="color" value={config.strokeColor} onChange={(e) => updateConfig('strokeColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer" />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="flex justify-between text-xs text-gray-600">
                      <span>描边粗细</span><span>{config.strokeWidth}px</span>
                    </label>
                    <input type="range" min="0" max="20" value={config.strokeWidth} onChange={(e) => updateConfig('strokeWidth', Number(e.target.value))} className="w-full" />
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-2 border-t border-gray-100">
                    <div className="space-y-1">
                      <label className="block text-xs text-gray-600">绿幕背景颜色</label>
                      <input type="color" value={config.bgColor} onChange={(e) => updateConfig('bgColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer" />
                    </div>
                    <div className="space-y-1">
                      <label className="block text-xs text-gray-600">背景不透明度(%)</label>
                      <input type="number" min="0" max="100" value={config.bgOpacity} onChange={(e) => updateConfig('bgOpacity', Number(e.target.value))} className="w-full p-1 border border-gray-300 rounded outline-none text-sm" />
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* 字幕显示区域 */}
          <div className="flex-1 w-full overflow-y-auto px-8 flex flex-col items-center hide-scrollbar">
            <div className={`w-full flex flex-col gap-6 max-w-6xl pt-24 pb-12 ${verticalMarginClass}`} style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
              
              {history.length === 0 && !currentTranscript && (
                <div className="text-gray-500 mt-10 opacity-80 font-bold" style={{ fontSize: '24px' }}>
                  {isListening ? "🎙️ 等待声音输入..." : "点击左上角开启识别"}
                </div>
              )}

              {/* 历史记录（包含原文与翻译） */}
              {history.map((item) => (
                <div key={item.id} className="w-full flex flex-col break-words tracking-wide" style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
                  <div style={{ ...baseTextStyle, fontSize: `${config.mainFontSize}px`, color: config.mainFontColor }}>
                    {item.original}
                  </div>
                  {config.trans1Enabled && item.t1 && (
                    <div style={{ ...baseTextStyle, fontSize: `${config.trans1Size}px`, color: config.trans1Color }}>
                      {item.t1}
                    </div>
                  )}
                  {config.trans2Enabled && item.t2 && (
                    <div style={{ ...baseTextStyle, fontSize: `${config.trans2Size}px`, color: config.trans2Color }}>
                      {item.t2}
                    </div>
                  )}
                </div>
              ))}

              {/* 当前正在说的临时句子 */}
              {currentTranscript && (
                <div className="w-full flex flex-col break-words tracking-wide" style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
                  <div style={{ ...baseTextStyle, fontSize: `${config.mainFontSize}px`, color: config.mainFontColor, opacity: 0.6 }}>
                    {currentTranscript}
                  </div>
                </div>
              )}
              
              {/* 底部定位锚点 */}
              <div ref={scrollRef} className="h-4 w-full shrink-0" />
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
