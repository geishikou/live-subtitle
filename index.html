<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时滚动字幕与翻译 (上下布局版)</title>
  
  <!-- 引入 React 和 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor 图标库 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
    .hide-scrollbar::-webkit-scrollbar { width: 0px; background: transparent; }
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    body { margin: 0; padding: 0; overflow: hidden; }

    /* 移动端安全区域与适配 */
    .safe-pt { padding-top: max(16px, env(safe-area-inset-top)); }
    .safe-pb { padding-bottom: max(48px, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 默认配置项
    const defaultConfig = {
      language: 'zh-CN',
      gasUrl: '',
      pauseDuration: 800, // 核心机制：呼吸停顿检测毫秒数，默认 800ms
      
      trans1Enabled: false, trans1Lang: 'en', trans1Color: '#FFFF00', trans1Size: 36,
      trans2Enabled: false, trans2Lang: 'ja', trans2Color: '#00FFFF', trans2Size: 36,
      
      fontFamily: 'sans-serif', fontWeight: 900, textAlign: 'center', verticalAlign: 'bottom',
      letterSpacing: 0, lineHeight: 1.2,
      
      mainFontSize: 48, mainFontColor: '#FFFFFF', strokeColor: '#000000', strokeWidth: 4,
      bgColor: '#00FF00', bgOpacity: 100
    };

    const App = () => {
      // --- 核心状态 ---
      const [isListening, setIsListening] = useState(false);
      const [history, setHistory] = useState([]); // { id, original, t1, t2 }
      const [currentTranscript, setCurrentTranscript] = useState('');

      // 统一 UI 显示状态（true 为展开设置，false 为 OBS 纯净模式）
      const [showUI, setShowUI] = useState(true);

      // --- 统一配置管理 (支持本地存储) ---
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('subtitleConfig');
          if (saved) return { ...defaultConfig, ...JSON.parse(saved) };
        } catch (e) {
          console.error("加载配置失败", e);
        }
        return defaultConfig;
      });

      // 每次 config 改变时，自动保存到 localStorage
      useEffect(() => {
        localStorage.setItem('subtitleConfig', JSON.stringify(config));
      }, [config]);

      const updateConfig = (key, value) => {
        setConfig(prev => ({ ...prev, [key]: value }));
      };

      // --- 导入与导出配置 ---
      const handleExport = () => {
        try {
          const jsonString = JSON.stringify(config, null, 2);
          const blob = new Blob([jsonString], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          
          const downloadAnchorNode = document.createElement('a');
          downloadAnchorNode.href = url;
          downloadAnchorNode.download = "subtitle_settings.json";
          
          document.body.appendChild(downloadAnchorNode);
          downloadAnchorNode.click();
          
          document.body.removeChild(downloadAnchorNode);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error("导出失败:", error);
          alert("导出配置失败，请检查浏览器权限。");
        }
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const importedConfig = JSON.parse(e.target.result);
            setConfig(prev => ({ ...prev, ...importedConfig }));
            alert("配置导入成功！");
          } catch (error) {
            console.error("导入失败:", error);
            alert("导入失败，文件格式不正确或已损坏。");
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      // --- Refs ---
      const recognitionRef = useRef(null);
      const scrollRef = useRef(null);
      const silenceTimerRef = useRef(null); // 用于跟踪呼吸停顿的定时器
      
      // 使用 Ref 追踪最新状态以供异步事件使用
      const stateRef = useRef({ 
        isListening, 
        gasUrl: config.gasUrl, 
        language: config.language,
        pauseDuration: config.pauseDuration,
        trans1Enabled: config.trans1Enabled, trans1Lang: config.trans1Lang, 
        trans2Enabled: config.trans2Enabled, trans2Lang: config.trans2Lang 
      });

      useEffect(() => {
        stateRef.current = { 
          isListening, 
          gasUrl: config.gasUrl, 
          language: config.language,
          pauseDuration: config.pauseDuration,
          trans1Enabled: config.trans1Enabled, trans1Lang: config.trans1Lang, 
          trans2Enabled: config.trans2Enabled, trans2Lang: config.trans2Lang 
        };
      }, [isListening, config.gasUrl, config.language, config.pauseDuration, config.trans1Enabled, config.trans1Lang, config.trans2Enabled, config.trans2Lang]);

      // --- 翻译 API 调用 (Google Apps Script) ---
      const fetchTranslation = async (text, targetLang) => {
        const url = stateRef.current.gasUrl.trim();
        if (!url) return "[请先配置 GAS URL]";
        
        try {
          let sourceLang = stateRef.current.language;
          if (sourceLang === 'ja-JP') sourceLang = 'ja';
          else if (sourceLang === 'en-US') sourceLang = 'en';
          else if (sourceLang === 'ko-KR') sourceLang = 'ko';

          const res = await fetch(`${url}?text=${encodeURIComponent(text)}&source=${sourceLang}&target=${targetLang}`);
          const translatedText = await res.text();
          return translatedText;
        } catch (e) {
          console.error("GAS Fetch error:", e);
          return "[网络错误或跨域拦截]";
        }
      };

      // --- 核心：提取手动提交文字并翻译的逻辑 ---
      const commitText = async (text) => {
        const trimmedText = text.trim();
        if (!trimmedText) return;

        const itemId = Date.now() + Math.random().toString();
        
        setHistory((prev) => [
          ...prev, 
          { 
            id: itemId, 
            original: trimmedText, 
            t1: stateRef.current.trans1Enabled ? '...' : '', 
            t2: stateRef.current.trans2Enabled ? '...' : '' 
          }
        ]);

        setCurrentTranscript('');

        const t1Promise = stateRef.current.trans1Enabled 
          ? fetchTranslation(trimmedText, stateRef.current.trans1Lang) 
          : Promise.resolve('');
        
        const t2Promise = stateRef.current.trans2Enabled 
          ? fetchTranslation(trimmedText, stateRef.current.trans2Lang) 
          : Promise.resolve('');

        const [res1, res2] = await Promise.all([t1Promise, t2Promise]);

        setHistory((prev) => 
          prev.map(item => 
            item.id === itemId ? { ...item, t1: res1, t2: res2 } : item
          )
        );
      };

      // --- 初始化语音识别 ---
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("您的浏览器不支持语音识别 API。");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognitionRef.current = recognition;

        recognition.onresult = (event) => {
          // 每次监听到新的声音或文字变化，就清除之前的停顿倒计时
          if (silenceTimerRef.current) {
            clearTimeout(silenceTimerRef.current);
          }

          let currentInterim = '';
          let currentFinals = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              currentFinals += event.results[i][0].transcript;
            } else {
              currentInterim += event.results[i][0].transcript;
            }
          }

          if (currentFinals) {
            commitText(currentFinals);
          }

          setCurrentTranscript(currentInterim);

          // 核心机制：呼吸停顿检测
          // 如果存在临时文字，且设定的检测时间有效，重新开启倒计时
          if (currentInterim && stateRef.current.isListening && stateRef.current.pauseDuration > 0) {
            silenceTimerRef.current = setTimeout(() => {
              // 如果在这个毫秒数内没有新的语音输入（倒计时顺利走完）
              if (recognitionRef.current && stateRef.current.isListening) {
                try {
                  // 主动让引擎结算当前句子，保证上下文完整，不会切开半个词
                  recognitionRef.current.stop();
                } catch (e) {
                  // 忽略报错
                }
              }
            }, stateRef.current.pauseDuration);
          }
        };

        recognition.onerror = (event) => {
          if (event.error === 'no-speech' || event.error === 'aborted') {
            return;
          }
          console.error("Speech recognition error", event.error);
          if (event.error === 'not-allowed') {
            setIsListening(false);
            stateRef.current.isListening = false;
            alert("麦克风被拒绝！请检查浏览器权限。");
          }
        };

        recognition.onend = () => {
          // 如果是因为我们的断句 stop() 导致的结束，立即无缝重启
          if (stateRef.current.isListening) {
            setTimeout(() => {
              try {
                if (recognitionRef.current && stateRef.current.isListening) {
                  recognitionRef.current.start();
                }
              } catch (e) {}
            }, 100); // 极短的延迟，保证无缝衔接
          }
        };

        return () => {
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          if (silenceTimerRef.current) {
            clearTimeout(silenceTimerRef.current);
          }
        };
      }, []);

      // 监听语言变化
      useEffect(() => {
        if (recognitionRef.current) {
          recognitionRef.current.lang = config.language;
          if (stateRef.current.isListening) {
            recognitionRef.current.stop();
          }
        }
      }, [config.language]);

      // 控制开关
      const toggleListening = () => {
        const nextState = !isListening;
        setIsListening(nextState);
        stateRef.current.isListening = nextState;
        
        if (nextState) {
          try {
            recognitionRef.current.start();
          } catch (e) {}
        } else {
          recognitionRef.current.stop();
          setCurrentTranscript('');
          if (silenceTimerRef.current) {
            clearTimeout(silenceTimerRef.current);
          }
        }
      };

      // 自动滚动
      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [history, currentTranscript]);

      const hexToRgba = (hex, alpha) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha / 100})`;
      };

      // --- 样式定义 ---
      const baseTextStyle = {
        fontFamily: config.fontFamily,
        fontWeight: config.fontWeight,
        WebkitTextStroke: `${config.strokeWidth}px ${config.strokeColor}`,
        paintOrder: 'stroke fill',
        lineHeight: config.lineHeight,
        letterSpacing: `${config.letterSpacing}px`,
        textAlign: config.textAlign,
        margin: '2px 0'
      };

      // 垂直对齐 CSS 逻辑
      const verticalMarginClass = 
        config.verticalAlign === 'top' ? 'mb-auto mt-0' :
        config.verticalAlign === 'center' ? 'my-auto' :
        'mt-auto mb-0';

      return (
        <div className="flex flex-col w-full h-[100dvh] overflow-hidden font-sans bg-gray-100">
          
          {/* 上半部分：控制栏与设置面板 */}
          {showUI && (
            <div className="flex flex-col shrink-0 w-full z-40 bg-white shadow-md transition-all relative">
              
              {/* 控制工具栏 */}
              <div className="flex flex-wrap items-center gap-3 px-4 py-3 safe-pt border-b border-gray-200">
                <button
                  onClick={toggleListening}
                  className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold shadow-md transition-colors ${
                    isListening ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white'
                  }`}
                >
                  <i className={`ph-bold text-lg ${isListening ? 'ph-microphone-slash' : 'ph-microphone'}`}></i>
                  {isListening ? '停止识别' : '开始识别'}
                </button>

                {/* 快捷切换主要语种下拉框 */}
                <div className="flex items-center bg-gray-100 hover:bg-gray-200 rounded-full px-4 shadow-inner transition-colors border border-gray-200">
                  <i className="ph-bold ph-translate text-gray-500 mr-2 text-lg"></i>
                  <select 
                    value={config.language} 
                    onChange={(e) => updateConfig('language', e.target.value)}
                    className="bg-transparent text-sm font-bold text-gray-800 outline-none cursor-pointer py-2.5 appearance-none"
                    title="快捷切换您的说话语言"
                  >
                    <option value="zh-CN">🇨🇳 原文: 中</option>
                    <option value="en-US">🇺🇸 原文: 英</option>
                    <option value="ja-JP">🇯🇵 原文: 日</option>
                    <option value="ko-KR">🇰🇷 原文: 韩</option>
                    <option value="zh-TW">🇹🇼 原文: 繁</option>
                  </select>
                  <i className="ph-bold ph-caret-down text-gray-400 ml-2 text-xs pointer-events-none"></i>
                </div>

                {/* 动态显示的翻译 1 快捷切换框 */}
                {config.trans1Enabled && (
                  <div className="flex items-center bg-blue-50 hover:bg-blue-100 rounded-full px-3 shadow-inner transition-colors border border-blue-200">
                    <i className="ph-bold ph-globe-hemisphere-west text-blue-500 mr-1.5 text-lg"></i>
                    <select 
                      value={config.trans1Lang} 
                      onChange={(e) => updateConfig('trans1Lang', e.target.value)}
                      className="bg-transparent text-sm font-bold text-blue-800 outline-none cursor-pointer py-2.5 appearance-none"
                      title="快捷切换翻译 1 的目标语言"
                    >
                      <option value="en">🇺🇸 译: Eng</option>
                      <option value="ja">🇯🇵 译: 日</option>
                      <option value="zh-CN">🇨🇳 译: 简</option>
                      <option value="zh-TW">🇹🇼 译: 繁</option>
                      <option value="ko">🇰🇷 译: 韩</option>
                    </select>
                    <i className="ph-bold ph-caret-down text-blue-400 ml-1 text-xs pointer-events-none"></i>
                  </div>
                )}

                {/* 动态显示的翻译 2 快捷切换框 */}
                {config.trans2Enabled && (
                  <div className="flex items-center bg-purple-50 hover:bg-purple-100 rounded-full px-3 shadow-inner transition-colors border border-purple-200">
                    <i className="ph-bold ph-globe-hemisphere-west text-purple-500 mr-1.5 text-lg"></i>
                    <select 
                      value={config.trans2Lang} 
                      onChange={(e) => updateConfig('trans2Lang', e.target.value)}
                      className="bg-transparent text-sm font-bold text-purple-800 outline-none cursor-pointer py-2.5 appearance-none"
                      title="快捷切换翻译 2 的目标语言"
                    >
                      <option value="en">🇺🇸 译: Eng</option>
                      <option value="ja">🇯🇵 译: 日</option>
                      <option value="zh-CN">🇨🇳 译: 简</option>
                      <option value="zh-TW">🇹🇼 译: 繁</option>
                      <option value="ko">🇰🇷 译: 韩</option>
                    </select>
                    <i className="ph-bold ph-caret-down text-purple-400 ml-1 text-xs pointer-events-none"></i>
                  </div>
                )}

                <div className="flex-1"></div> {/* 占位，把后面的按钮推到右侧 */}

                <button
                  onClick={() => setHistory([])}
                  className="flex items-center gap-2 px-5 py-2.5 rounded-full bg-white text-gray-800 border border-gray-200 shadow-sm hover:bg-gray-50 font-bold transition-colors"
                >
                  <i className="ph-bold ph-trash text-lg"></i> 清空字幕
                </button>
              </div>

              {/* 展开的设置面板内容 */}
              <div className="flex flex-col w-full max-h-[50vh] bg-gray-50 border-b border-gray-300">
                <div className="flex justify-between items-center px-6 py-2 border-b border-gray-200 bg-white shrink-0">
                  <span className="font-bold text-gray-700 text-sm flex items-center gap-1">
                    <i className="ph-bold ph-sliders text-base"></i> 个性化设置
                  </span>
                  <div className="flex items-center gap-2">
                    {/* 导入配置按钮 */}
                    <div className="relative group flex items-center">
                      <label className="text-gray-600 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg cursor-pointer transition-colors block border border-gray-200">
                        <i className="ph-bold ph-folder-open text-base block"></i>
                        <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                      </label>
                      <div className="absolute top-full right-0 mt-1 whitespace-nowrap bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 shadow-lg">导入配置</div>
                    </div>
                    
                    {/* 导出配置按钮 */}
                    <div className="relative group flex items-center">
                      <button onClick={handleExport} className="text-gray-600 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg transition-colors border border-gray-200">
                        <i className="ph-bold ph-floppy-disk text-base block"></i>
                      </button>
                      <div className="absolute top-full right-0 mt-1 whitespace-nowrap bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 shadow-lg">导出配置</div>
                    </div>

                    <div className="w-px h-5 bg-gray-300 mx-1"></div>
                    
                    {/* 隐藏面板按钮 */}
                    <div className="relative group flex items-center">
                      <button onClick={() => setShowUI(false)} className="text-gray-600 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition-colors border border-gray-200">
                        <i className="ph-bold ph-x text-base block"></i>
                      </button>
                      <div className="absolute top-full right-0 mt-1 whitespace-nowrap bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 shadow-lg">隐藏UI (进入纯净模式)</div>
                    </div>
                  </div>
                </div>

                {/* 4列网格排版 */}
                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                  
                  {/* 模块：语音与API */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1"><i className="ph-bold ph-microphone-stage text-base"></i> 语音与翻译 API</h3>
                    <div className="space-y-2">
                      <label className="block text-xs font-bold text-gray-700">识别语言</label>
                      <select value={config.language} onChange={(e) => updateConfig('language', e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-lg outline-none bg-white shadow-sm">
                        <option value="zh-CN">中文 (简体)</option>
                        <option value="zh-TW">中文 (繁體)</option>
                        <option value="ja-JP">日本語</option>
                        <option value="en-US">English (US)</option>
                        <option value="ko-KR">한국어</option>
                      </select>
                    </div>

                    {/* 新增：呼吸停顿检测 */}
                    <div className="space-y-2 pt-2 border-t border-gray-200">
                      <label className="flex justify-between text-xs font-bold text-gray-700">
                        <span>断句等待时间 (呼吸检测)</span>
                        <span className="text-blue-600">{config.pauseDuration} ms</span>
                      </label>
                      <input 
                        type="range" min="400" max="2500" step="100" 
                        value={config.pauseDuration} 
                        onChange={(e) => updateConfig('pauseDuration', Number(e.target.value))} 
                        className="w-full accent-blue-500" 
                      />
                      <p className="text-[10px] text-gray-500 leading-tight">通过检测您的短暂呼吸停顿进行完整意群断句。<br/>• 设得越小：翻译越快，但可能会把一句话拆碎。<br/>• 设得越大：句子越完整，但出字幕较慢。<br/>* 建议值：800ms ~ 1200ms</p>
                    </div>

                    <div className="space-y-2 pt-2 border-t border-gray-200">
                      <label className="block text-xs font-bold text-gray-700">Google Apps Script (GAS) URL</label>
                      <input 
                        type="text" 
                        placeholder="https://script.google.com/macros/s/..."
                        value={config.gasUrl}
                        onChange={(e) => updateConfig('gasUrl', e.target.value)}
                        className="w-full p-2 text-sm border border-gray-300 rounded-lg outline-none bg-white shadow-sm"
                      />
                    </div>
                  </div>

                  {/* 模块：翻译目标 */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1"><i className="ph-bold ph-globe-hemisphere-west text-base"></i> 多语言翻译</h3>
                    
                    {/* 翻译 1 */}
                    <div className="p-3 bg-white border border-gray-200 shadow-sm rounded-xl space-y-2">
                      <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-blue-800">
                        <input type="checkbox" checked={config.trans1Enabled} onChange={(e) => updateConfig('trans1Enabled', e.target.checked)} className="rounded" />
                        开启翻译 1
                      </label>
                      {config.trans1Enabled && (
                        <div className="grid grid-cols-3 gap-2 mt-2">
                          <select value={config.trans1Lang} onChange={(e) => updateConfig('trans1Lang', e.target.value)} className="col-span-3 p-1.5 text-xs border border-gray-200 rounded outline-none bg-gray-50">
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="zh-CN">中文(简体)</option>
                            <option value="zh-TW">中文(繁體)</option>
                            <option value="ko">한국어</option>
                          </select>
                          <div className="col-span-2 flex items-center gap-1">
                            <span className="text-[10px] text-gray-600 whitespace-nowrap">大小 ({config.trans1Size}px)</span>
                            <input type="range" min="12" max="80" value={config.trans1Size} onChange={(e) => updateConfig('trans1Size', Number(e.target.value))} className="w-full accent-blue-500" />
                          </div>
                          <input type="color" value={config.trans1Color} onChange={(e) => updateConfig('trans1Color', e.target.value)} className="w-full h-6 p-0 border-0 rounded cursor-pointer col-span-1" />
                        </div>
                      )}
                    </div>

                    {/* 翻译 2 */}
                    <div className="p-3 bg-white border border-gray-200 shadow-sm rounded-xl space-y-2">
                      <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-purple-800">
                        <input type="checkbox" checked={config.trans2Enabled} onChange={(e) => updateConfig('trans2Enabled', e.target.checked)} className="rounded" />
                        开启翻译 2
                      </label>
                      {config.trans2Enabled && (
                        <div className="grid grid-cols-3 gap-2 mt-2">
                          <select value={config.trans2Lang} onChange={(e) => updateConfig('trans2Lang', e.target.value)} className="col-span-3 p-1.5 text-xs border border-gray-200 rounded outline-none bg-gray-50">
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="zh-CN">中文(简体)</option>
                            <option value="zh-TW">中文(繁體)</option>
                            <option value="ko">한국어</option>
                          </select>
                          <div className="col-span-2 flex items-center gap-1">
                            <span className="text-[10px] text-gray-600 whitespace-nowrap">大小 ({config.trans2Size}px)</span>
                            <input type="range" min="12" max="80" value={config.trans2Size} onChange={(e) => updateConfig('trans2Size', Number(e.target.value))} className="w-full accent-purple-500" />
                          </div>
                          <input type="color" value={config.trans2Color} onChange={(e) => updateConfig('trans2Color', e.target.value)} className="w-full h-6 p-0 border-0 rounded cursor-pointer col-span-1" />
                        </div>
                      )}
                    </div>
                  </div>

                  {/* 模块：排版与布局 */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1"><i className="ph-bold ph-text-aa text-base"></i> 字体与排版</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">字体类型</label>
                        <select value={config.fontFamily} onChange={(e) => updateConfig('fontFamily', e.target.value)} className="w-full p-1.5 text-xs border border-gray-300 rounded outline-none bg-white">
                          <option value="sans-serif">无衬线体 (黑体)</option>
                          <option value="serif">衬线体 (宋体)</option>
                          <option value="monospace">等宽字体</option>
                          <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                          <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                        </select>
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">字体粗细</label>
                        <select value={config.fontWeight} onChange={(e) => updateConfig('fontWeight', Number(e.target.value))} className="w-full p-1.5 text-xs border border-gray-300 rounded outline-none bg-white">
                          <option value="400">常规 (Normal)</option>
                          <option value="700">粗体 (Bold)</option>
                          <option value="900">黑体 (Black)</option>
                        </select>
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">水平对齐</label>
                        <div className="flex border border-gray-300 rounded overflow-hidden shadow-sm">
                          {['left', 'center', 'right'].map(align => (
                            <button 
                              key={`h-${align}`} onClick={(e) => { e.stopPropagation(); updateConfig('textAlign', align); }}
                              className={`flex-1 py-1 text-base flex justify-center items-center ${config.textAlign === align ? 'bg-gray-200 text-black' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                              title={`水平居${align === 'left' ? '左' : align === 'right' ? '右' : '中'}`}
                            >
                              <i className={`ph-bold ph-text-align-${align}`}></i>
                            </button>
                          ))}
                        </div>
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">垂直对齐</label>
                        <div className="flex border border-gray-300 rounded overflow-hidden shadow-sm">
                          {[
                            { val: 'top', icon: 'ph-align-top' }, 
                            { val: 'center', icon: 'ph-align-center-vertical' }, 
                            { val: 'bottom', icon: 'ph-align-bottom' }
                          ].map(align => (
                            <button 
                              key={`v-${align.val}`} onClick={(e) => { e.stopPropagation(); updateConfig('verticalAlign', align.val); }}
                              className={`flex-1 py-1 text-base flex justify-center items-center ${config.verticalAlign === align.val ? 'bg-gray-200 text-black' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                              title={`垂直居${align.val === 'top' ? '上' : align.val === 'bottom' ? '下' : '中'}`}
                            >
                              <i className={`ph-bold ${align.icon}`}></i>
                            </button>
                          ))}
                        </div>
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">行高 ({config.lineHeight})</label>
                        <input type="range" min="1" max="2.5" step="0.1" value={config.lineHeight} onChange={(e) => updateConfig('lineHeight', Number(e.target.value))} className="w-full" />
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs font-bold text-gray-600">字间距 ({config.letterSpacing}px)</label>
                        <input type="range" min="-5" max="20" step="1" value={config.letterSpacing} onChange={(e) => updateConfig('letterSpacing', Number(e.target.value))} className="w-full" />
                      </div>
                    </div>
                  </div>

                  {/* 模块：主字幕与背景颜色 */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1"><i className="ph-bold ph-palette text-base"></i> 颜色与背景</h3>
                    <div className="space-y-1">
                      <label className="flex justify-between text-xs font-bold text-gray-600">
                        <span>主字幕大小</span><span className="text-gray-800">{config.mainFontSize}px</span>
                      </label>
                      <input type="range" min="16" max="100" value={config.mainFontSize} onChange={(e) => updateConfig('mainFontSize', Number(e.target.value))} className="w-full" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="space-y-1">
                        <label className="block text-xs text-gray-600">字体颜色</label>
                        <input type="color" value={config.mainFontColor} onChange={(e) => updateConfig('mainFontColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer shadow-sm" />
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs text-gray-600">描边颜色</label>
                        <input type="color" value={config.strokeColor} onChange={(e) => updateConfig('strokeColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer shadow-sm" />
                      </div>
                    </div>
                    <div className="space-y-1">
                      <label className="flex justify-between text-xs text-gray-600">
                        <span>描边粗细</span><span>{config.strokeWidth}px</span>
                      </label>
                      <input type="range" min="0" max="20" value={config.strokeWidth} onChange={(e) => updateConfig('strokeWidth', Number(e.target.value))} className="w-full" />
                    </div>
                    <div className="grid grid-cols-2 gap-3 pt-3 border-t border-gray-200">
                      <div className="space-y-1">
                        <label className="block text-xs text-gray-600">绿幕背景颜色</label>
                        <input type="color" value={config.bgColor} onChange={(e) => updateConfig('bgColor', e.target.value)} className="w-full h-8 p-0 border-0 rounded cursor-pointer shadow-sm" />
                      </div>
                      <div className="space-y-1">
                        <label className="block text-xs text-gray-600">背景不透明度(%)</label>
                        <input type="number" min="0" max="100" value={config.bgOpacity} onChange={(e) => updateConfig('bgOpacity', Number(e.target.value))} className="w-full p-1 border border-gray-300 rounded outline-none text-sm shadow-sm" />
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* 下半部分：字幕主显示区域 (整个区域可点击切换模式) */}
          <div 
            className="flex-1 relative flex flex-col w-full h-full overflow-hidden transition-all duration-300 shadow-inner cursor-pointer"
            style={{ backgroundColor: hexToRgba(config.bgColor, config.bgOpacity) }}
            onClick={() => setShowUI(!showUI)}
            title={showUI ? "点击进入纯净模式" : "点击显示控制面板"}
          >
            {/* 隐藏UI模式下的轻量级提示 */}
            {!showUI && (
              <div className="absolute top-0 left-0 w-full h-32 z-50 group flex items-center justify-center pointer-events-none">
                <div className="opacity-0 group-hover:opacity-100 bg-black/60 text-white px-8 py-3 rounded-full transition-opacity shadow-2xl backdrop-blur-sm font-bold tracking-widest border border-white/20">
                  点击屏幕任意区域恢复控制面板
                </div>
              </div>
            )}

            {/* 字幕滚动内容区 */}
            <div className="flex-1 w-full overflow-y-auto px-4 sm:px-12 flex flex-col items-center hide-scrollbar safe-pb pointer-events-none">
              <div className={`w-full flex flex-col gap-6 max-w-6xl pt-12 pb-12 ${verticalMarginClass}`} style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
                
                {history.length === 0 && !currentTranscript && (
                  <div className="text-gray-500 mt-10 opacity-70 font-bold tracking-wider" style={{ fontSize: '24px' }}>
                    {isListening ? "🎙️ 正在聆听声音输入..." : (showUI ? "点击左上角开启识别" : "点击屏幕展开面板并开启识别")}
                  </div>
                )}

                {/* 历史记录（包含原文与翻译） */}
                {history.map((item) => (
                  <div key={item.id} className="w-full flex flex-col break-words tracking-wide pointer-events-auto" style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
                    <div style={{ ...baseTextStyle, fontSize: `${config.mainFontSize}px`, color: config.mainFontColor }}>
                      {item.original}
                    </div>
                    {config.trans1Enabled && item.t1 && (
                      <div style={{ ...baseTextStyle, fontSize: `${config.trans1Size}px`, color: config.trans1Color }}>
                        {item.t1}
                      </div>
                    )}
                    {config.trans2Enabled && item.t2 && (
                      <div style={{ ...baseTextStyle, fontSize: `${config.trans2Size}px`, color: config.trans2Color }}>
                        {item.t2}
                      </div>
                    )}
                  </div>
                ))}

                {/* 当前正在说的临时句子 */}
                {currentTranscript && (
                  <div className="w-full flex flex-col break-words tracking-wide pointer-events-auto" style={{ alignItems: config.textAlign === 'left' ? 'flex-start' : config.textAlign === 'right' ? 'flex-end' : 'center' }}>
                    <div style={{ ...baseTextStyle, fontSize: `${config.mainFontSize}px`, color: config.mainFontColor, opacity: 0.6 }}>
                      {currentTranscript}
                    </div>
                  </div>
                )}
                
                {/* 底部定位锚点 */}
                <div ref={scrollRef} className="h-4 w-full shrink-0" />
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
